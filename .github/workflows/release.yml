name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  pacote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir versão e empacotar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(jq -r .id module.json)
          VER=$(jq -r .version module.json)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VER" ]; then echo "Tag $GITHUB_REF_NAME diferente da versão $VER do module.json"; exit 1; fi
          grep -q "releases/download/v${VER}/${ID}.zip" module.json || { echo "O link de download do module.json não aponta para v${VER}."; exit 1; }
          # só o que o Foundry precisa, com module.json na raiz
          zip -r "$ID.zip" module.json scripts styles templates assets lang README.md LICENSE
          gh release upload "$GITHUB_REF_NAME" "$ID.zip" module.json --clobber
